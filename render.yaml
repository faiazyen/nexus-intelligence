databases:
  - name: nexus-intelligence-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: nexus-intelligence-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-intelligence-db
          property: connectionString
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEXUS_DAILY_LLM_LIMIT
        value: "0.25"
      - key: APOLLO_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: CRUNCHBASE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
