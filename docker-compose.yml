# NEXUS Intelligence — local development stack
#
# Usage:
#   cp .env.example .env        # add your OPENROUTER_API_KEY
#   docker-compose up --build
#
# Services (per docs/CONTRACT.md):
#   postgres  postgres:16-alpine   :5432
#   qdrant    qdrant/qdrant        :6333
#   backend   backend/Dockerfile   :8000
#   frontend  frontend/Dockerfile  :3000
#
# All LLM calls route through OpenRouter (app/core/llm_router.py) — no
# Redis service needed; the daily cost tracker is a plain file under
# backend/logs/. DATABASE_URL / QDRANT_URL are pinned to the compose
# service network here (a host-side .env pointing at localhost must not
# leak into containers). API keys pass through from .env with empty
# defaults — agents degrade gracefully without them.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    # qdrant image ships no curl/wget; probe the HTTP port with bash's
    # built-in /dev/tcp instead.
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://nexus:nexus@postgres:5432/nexus
      QDRANT_URL: http://qdrant:6333
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NEXUS_DAILY_LLM_LIMIT: ${NEXUS_DAILY_LLM_LIMIT:-0.25}
      NEXUS_DISABLE_CLAUDE: ${NEXUS_DISABLE_CLAUDE:-false}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      CRUNCHBASE_API_KEY: ${CRUNCHBASE_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000
    # Run migrations, then serve with hot reload (source is bind-mounted).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* vars are inlined at build time by Next.js.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend

volumes:
  pgdata:
  qdrant_data:
