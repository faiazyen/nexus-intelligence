# NEXUS Intelligence — CI
# Runs on every PR and on push to main. Backend: ruff (advisory) + pytest.
# Frontend: type-checked production build. Deploy (deploy.yml) chains off a
# successful CI run on main via workflow_run.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # --exit-zero keeps lint advisory while the codebase stabilizes;
      # flip to a hard gate by removing the flag.
      - name: Lint (ruff, advisory)
        run: ruff check backend/app --exit-zero

      - name: Tests (pytest)
        run: pytest backend/tests -x
        env:
          PYTHONPATH: backend

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
